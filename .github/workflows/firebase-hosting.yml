# Publishes the site to Firebase Hosting on every push to main.
#
# The key is handed to the steps through env, never pasted into a shell command:
# a service account key is pretty-printed JSON, and substituting that straight
# into a command breaks the command.
name: Publish to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the key
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 .github/scripts/prepare-key.py

      - name: Publish
        if: steps.key.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        run: npx --yes firebase-tools@latest deploy --only hosting --project vutto-attendance --non-interactive
